spring.application.name=Gateway
server.port=8080

# 2. Eureka Client Settings (Use your Eureka port 8761)
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.client.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# 3. Route for AUTH-SERVICE
# This says: Any request starting with /auth/ goes to Auth Service
spring.cloud.gateway.routes[0].id=harmoni-auth-service
spring.cloud.gateway.routes[0].uri=lb://harmoni-auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

# 4. Route for MASTER-SERVICE
# This says: Any request starting with /api/ goes to Master Service
spring.cloud.gateway.routes[1].id=harmoni-master-service
spring.cloud.gateway.routes[1].uri=lb://harmoni-master-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/**

# 5. CORS Configuration (CRITICAL for your React Frontend)
# This allows your React app (running on a different port) to talk to the Gateway
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=*
