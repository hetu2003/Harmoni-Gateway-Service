spring.application.name=Gateway
server.port=8080

# Eureka
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.client.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost
eureka.instance.ip-address=127.0.0.1

# Routes are defined in GatewayConfig.java (Java DSL)

# MUST match jwt.secret in Auth and Master services
jwt.secret=your-very-long-and-super-secret-key-that-is-at-least-256-bits-long-for-hs256

# ─── Logging ────────────────────────────────────────────────────────────────
logging.file.name=C:/Hetvee/Projects/Harmoni/logs/gateway.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=5
# WARN shows every REDIRECT_LOGIN decision; change to DEBUG to see every request
logging.level.com.Harmoni.Gateway.JwtAuthFilter=WARN
logging.level.com.Harmoni.Gateway=INFO
